  - generic [ref=e9]:
    - paragraph [ref=e10]: A groundbreaking study published this week suggests that reading news articles in a foreign language may be one of the most effective ways to build vocabulary. Researchers at Beijing Normal University tracked over 500 students over a six-month period and found that those who read daily English news articles improved their vocabulary retention by 40% compared to those using traditional flashcard methods.
    - paragraph [ref=e11]: The study divided participants into two groups. The first group used conventional vocabulary learning techniques, including flashcards and word lists. The second group read authentic English news articles for 20 minutes each day, looking up unfamiliar words as they encountered them in context.
    - paragraph [ref=e12]: The results were striking. The news-reading group not only learned more words over the study period but also demonstrated better understanding of how words are used in different contexts. They scored significantly higher on tests of collocation and idiomatic usage.
    - paragraph [ref=e13]: Dr. Li Wei, who led the research, explained that context-rich learning environments help the brain form stronger neural connections. When you encounter a word in a meaningful context, your brain creates multiple associations that make the word easier to recall later.
    - paragraph [ref=e14]: The study also noted that news articles provide natural spaced repetition. Important vocabulary items tend to appear repeatedly across different articles, giving learners multiple exposures to the same words in varied contexts. This aligns well with the principles of spaced repetition learning, which has been shown to be one of the most effective methods for long-term memory retention.
    - paragraph [ref=e15]: For English learners, the researchers recommend starting with news sources written at an appropriate difficulty level. They suggest that learners should aim to understand about 80% of the words in an article, with the remaining 20% being new vocabulary to acquire. This ratio, known as the optimal input hypothesis, provides enough comprehensible context while still offering sufficient challenge for growth.