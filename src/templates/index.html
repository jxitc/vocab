<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阅读 &mdash; Vocab in News</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a href="/" class="header-title">Vocab in News</a>
    <nav class="nav">
      <a href="/" class="active">阅读</a>
      <a href="/words">单词本</a>
      <a href="/quiz">测试</a>
    </nav>
  </div>
</header>

<main class="container">

  <!-- Login form — hidden when session is active -->
  <section id="login-section">
    <div class="login-prompt">
      <h2>欢迎使用 Vocab in News</h2>
      <p>输入你的名字，开始今天的阅读</p>
      <div class="form-group">
        <input type="text" id="username-input" placeholder="你的名字" maxlength="30">
        <button class="btn btn-primary" onclick="doLogin()">开始阅读</button>
      </div>
    </div>
  </section>

  <!-- Loading -->
  <section id="loading-section" class="hidden">
    <div class="loading">正在为你准备今天的文章...</div>
  </section>

  <!-- Article -->
  <section id="article-section" class="hidden">
    <div class="article-header">
      <h1 class="article-title" id="article-title"></h1>
      <div class="article-meta">
        <span id="article-source"></span> &middot; <span id="article-date"></span>
      </div>
    </div>

    <div id="paragraphs-container"></div>

    <!-- Word panel: 本课生词 -->
    <div class="word-panel hidden" id="word-panel">
      <div class="word-panel-title" id="word-panel-title">本课生词</div>
      <div id="word-panel-list"></div>
    </div>

    <div style="text-align:center;margin-top:24px;">
      <button class="btn btn-primary" onclick="markFinished()">我读完了</button>
    </div>
  </section>

</main>

<!-- Word Definition Popup (shared across pages) -->
<div id="word-popup-overlay" class="word-popup-overlay hidden" onclick="if(event.target===this)closePopup()">
  <div class="word-popup">
    <button class="popup-close" onclick="closePopup()">&times;</button>
    <div class="popup-word" id="popup-word"></div>
    <div class="popup-pos" id="popup-pos"></div>
    <div class="popup-definition" id="popup-definition"></div>
    <div class="popup-loading hidden" id="popup-loading">查询中...</div>
  </div>
</div>

<script>
/* ── Global state ── */
var currentUser = null;
var currentArticle = null;

/* ── Init: check session ── */
(async function init() {
  try {
    var r = await fetch('/api/session');
    var d = await r.json();
    if (d.user) { currentUser = d.user; loadArticle(); }
  } catch (_) {}
})();

/* ── Login ── */
async function doLogin() {
  var name = document.getElementById('username-input').value.trim();
  if (!name) return;
  await fetch('/api/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({username: name})
  });
  currentUser = name;
  document.getElementById('login-section').classList.add('hidden');
  loadArticle();
}

/* ── Load today's article ── */
async function loadArticle() {
  setSection('loading');
  try {
    var r = await fetch('/api/today');
    var art = await r.json();
    if (!art || !art.paragraphs) {
      document.getElementById('loading-section').innerHTML =
        '<div class="loading">今天还没有文章，请稍后再来</div>';
      return;
    }
    currentArticle = art;
    renderArticle(art);
    setSection('article');
  } catch (_) {
    document.getElementById('loading-section').innerHTML =
      '<div class="loading">加载失败，请刷新重试</div>';
  }
}

function setSection(name) {
  ['login-section','loading-section','article-section'].forEach(function(id) {
    document.getElementById(id).classList.toggle('hidden', id !== name + '-section');
  });
}

/* ── Render article ── */
function renderArticle(art) {
  document.getElementById('article-title').textContent = art.title || '';
  document.getElementById('article-source').textContent = art.source || '';
  document.getElementById('article-date').textContent = art.date || '';

  var container = document.getElementById('paragraphs-container');
  container.innerHTML = '';

  (art.paragraphs || []).forEach(function(p, i) {
    var wrap = document.createElement('div');
    wrap.className = 'paragraph';

    // Build token spans
    var line = document.createElement('span');
    (p.tokens || []).forEach(function(t) {
      var cls = t.is_difficult ? 'word difficult' : 'word normal';
      var sp = document.createElement('span');
      sp.className = cls;
      sp.textContent = t.word;
      sp.onclick = function() { lookupWord(t.word); };
      line.appendChild(sp);
      line.appendChild(document.createTextNode(' '));
    });
    // Fallback: raw text if no tokens
    if (!p.tokens || !p.tokens.length) {
      line.textContent = p.text;
    }
    wrap.appendChild(line);

    // Translation toggle
    if (p.translation) {
      var toggle = document.createElement('span');
      toggle.className = 'translation-toggle';
      toggle.textContent = '显示翻译';
      var trans = document.createElement('div');
      trans.className = 'translation-text';
      trans.textContent = p.translation;
      toggle.onclick = function() {
        var visible = trans.style.display === 'block';
        trans.style.display = visible ? 'none' : 'block';
        toggle.textContent = visible ? '显示翻译' : '隐藏翻译';
      };
      wrap.appendChild(toggle);
      wrap.appendChild(trans);
    }

    container.appendChild(wrap);
  });

  // Word panel
  var words = collectDifficultWords(art);
  var panel = document.getElementById('word-panel');
  if (words.length) {
    panel.classList.remove('hidden');
    document.getElementById('word-panel-title').textContent =
      '本课生词 (' + words.length + '个)';
    document.getElementById('word-panel-list').innerHTML =
      words.map(function(w) {
        return '<div class="word-panel-item">' +
          '<span class="word-panel-word" onclick="lookupWord(\'' +
            escAttr(w.word) + '\')">' + escHtml(w.word) + '</span>' +
          '<span class="word-panel-def">' + escHtml(w.definition || '') + '</span>' +
          '<button class="btn btn-small btn-outline" onclick="markLearned(\'' +
            escAttr(w.word) + '\',\'' + escAttr(w.definition||'') + '\',\'' +
            escAttr(w.pos||'') + '\',' + (w.level||0) +
            ')">已学</button></div>';
      }).join('');
  } else {
    panel.classList.add('hidden');
  }
}

function collectDifficultWords(art) {
  var seen = {};
  var words = [];
  (art.paragraphs || []).forEach(function(p) {
    (p.difficult_words || []).forEach(function(w) {
      var key = (w.word||'').toLowerCase();
      if (!seen[key]) { seen[key] = true; words.push(w); }
    });
  });
  return words;
}

/* ── Word lookup ── */
async function lookupWord(word) {
  var ov = document.getElementById('word-popup-overlay');
  ov.classList.remove('hidden');
  document.getElementById('popup-word').textContent = word;
  document.getElementById('popup-pos').textContent = '';
  document.getElementById('popup-definition').textContent = '';
  var ld = document.getElementById('popup-loading');
  ld.classList.remove('hidden');

  try {
    var r = await fetch('/api/lookup?word=' + encodeURIComponent(word));
    var d = await r.json();
    ld.classList.add('hidden');
    if (d.found) {
      document.getElementById('popup-pos').textContent = d.pos || '';
      document.getElementById('popup-definition').textContent = d.definition || '';
    } else {
      document.getElementById('popup-definition').textContent = '未找到该词的定义';
    }
  } catch (_) {
    ld.classList.add('hidden');
    document.getElementById('popup-definition').textContent = '查询失败，请重试';
  }
}

function closePopup() {
  document.getElementById('word-popup-overlay').classList.add('hidden');
}

/* ── Learn / Finish ── */
function markLearned(word, definition, pos, level) {
  fetch('/api/words/learn', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({word: word, definition: definition, pos: pos, level: level})
  }).then(function() {
    if (currentArticle) renderArticle(currentArticle);
  });
}

function markFinished() {
  fetch('/api/quiz/result', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({article_id: currentArticle ? currentArticle.id : 0, score: 0, total: 0})
  }).then(function() {
    alert('太棒了！你已经完成了今天的阅读。');
  });
}

/* ── Helpers ── */
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) {
  return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")
    .replace(/"/g,'\\"').replace(/\n/g,'\\n');
}
</script>
</body>
</html>
