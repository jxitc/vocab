<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新闻词汇学习 - Vocab in News</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC",
                         "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: #f5f5f5;
            color: #1a1a1a;
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 40px 24px 80px;
        }

        header {
            margin-bottom: 40px;
            padding-bottom: 24px;
            border-bottom: 2px solid #e0e0e0;
        }

        .site-name {
            font-size: 14px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 24px;
        }

        .article-title {
            font-size: 32px;
            font-weight: 700;
            line-height: 1.35;
            color: #111;
            margin-bottom: 16px;
        }

        .article-meta {
            font-size: 14px;
            color: #666;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .article-meta span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .article-body {
            font-size: 18px;
            line-height: 2;
            color: #222;
        }

        .article-body p {
            margin-bottom: 1.2em;
            text-indent: 2em;
        }

        .article-body p:first-of-type {
            text-indent: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="site-name">新闻词汇学习</div>
            <h1 class="article-title">{{ article.title }}</h1>
            <div class="article-meta">
                <span>来源: {{ article.source }}</span>
                <span>日期: {{ article.date }}</span>
            </div>
        </header>

        <div class="article-body">
            {% for paragraph in article.body.split('\n\n') %}
                <p>{{ paragraph }}</p>
            {% endfor %}
        </div>
    </div>
</body>
</html>
